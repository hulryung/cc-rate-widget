name: CCRateWidget
options:
  bundleIdPrefix: com.dkkang
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    DEVELOPMENT_TEAM: XGJ87M8ZZR
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: true
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false

targets:
  CCRateWidget:
    type: application
    platform: macOS
    sources:
      - path: CCRateWidget
      - path: Shared
      # Never listed here until now, in any commit — so the icon that 466c69d added
      # was compiled into nothing and the app shipped with the generic placeholder.
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dkkang.cc-rate-widget
        PRODUCT_NAME: Claude Rate Widget
        CODE_SIGN_ENTITLEMENTS: CCRateWidget/CCRateWidget.entitlements
        ENABLE_APP_SANDBOX: false
        INFOPLIST_FILE: CCRateWidget/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CCRateWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CCRateWidgetTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dkkang.cc-rate-widget.tests
        INFOPLIST_FILE: CCRateWidgetTests/Info.plist
        ENABLE_APP_SANDBOX: false
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  CCRateWidget:
    build:
      targets:
        CCRateWidget: all
        CCRateWidgetTests: all
    test:
      targets:
        - CCRateWidgetTests
