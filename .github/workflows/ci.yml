name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    # macos-14 defaults to Xcode 15, which cannot open the project XcodeGen now
    # emits (object format 77) and failed with "future Xcode project file format".
    # project.yml already declares xcodeVersion 16.0, so the runner has to match.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate xcodeproj
        run: xcodegen generate

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project CCRateWidget.xcodeproj \
            -scheme CCRateWidget \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
